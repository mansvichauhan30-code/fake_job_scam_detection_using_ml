{% extends "base.html" %}
{% block title %}Login - JobShield AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <span class="brand-mark"></span>
            <h3 class="d-inline">Welcome back</h3>
            <p class="text-muted mt-2">Login to access your dashboard and reports.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Your password">
            </div>
            <button type="submit" class="btn btn-amber w-100 mt-2">Login</button>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </p>

        <hr class="my-4">
        <p class="text-center text-muted small mb-0">
            <i class="bi bi-info-circle"></i> Demo Admin Login: admin@jobshield.com / Admin@123
        </p>
    </div>
</div>
{% endblock %}
